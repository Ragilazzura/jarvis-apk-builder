name: jarvis_agent
description: "Jarvis Mobile & Web Client App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Network & Stream
  http: ^1.2.0
  web_socket_channel: ^3.0.1

  onnxruntime: 1.4.1
  record: 7.1.1
  open_wake_word: ^0.1.0        # 👈 [BARU] Open-Source Wake Word Engine

  # 🔊 Audio, Speech & Volume Control
  just_audio: ^0.10.6
  speech_to_text: ^7.3.0
  volume_controller: ^3.6.0
  
  # 📷 Vision & UI
  image_picker: ^1.1.2
  flutter_markdown_plus: any
  cupertino_icons: ^1.0.8

  # 💾 Storage & Diagnostics
  shared_preferences: ^2.2.3
  disk_space_plus: ^0.2.1        

  # 🔔 Notification & Alarm
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # 🛰️ Telemetry, Battery & Sensors
  battery_plus: ^7.1.1
  geolocator: ^14.0.3
  intl: ^0.20.3

  # 🕹️ Native Android System Control
  screen_brightness: ^2.0.0      
  torch_light: ^2.0.0            
  url_launcher: ^6.3.0           

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/jarvis.png"
  adaptive_icon_background: "#030508"
  adaptive_icon_foreground: "assets/jarvis.png"

flutter:
  uses-material-design: true

  assets:
    - assets/jarvis.png
    - assets/models/melspectrogram.onnx    # 👈 [BARU] Model Audio Processor
    - assets/models/embedding_model.onnx   # 👈 [BARU] Model Embedding Utama
    - assets/models/hey_jarvis_v0.1.onnx        # 👈 [BARU] Model Trigger Suara "Jarvis"