name: jarvis_agent
description: "Jarvis Mobile & Web Client App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  audioplayers: ^6.0.0
  flutter_tts: ^4.2.1
  speech_to_text: ^7.3.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/jarvis.png