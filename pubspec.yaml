name: jarvis_agent
description: "Jarvis Mobile & Web Client App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Network & Stream
  http: ^1.2.0
  web_socket_channel: ^3.0.1

  # 🔊 Audio, Speech & Volume Control
  audioplayers: ^6.0.0
  speech_to_text: ^7.3.0
  volume_controller: ^2.0.7      # 👈 [BARU] Kontrol Volume HP

  # 📷 Vision & UI
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.7+1
  cupertino_icons: ^1.0.8

  # 💾 Storage & Diagnostics
  shared_preferences: ^2.2.3
  disk_space_plus: ^0.2.1        # 👈 [BARU] Diagnosa Penyimpanan/Storage HP

  # 🔔 Notification & Alarm
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # 🛰️ Telemetry, Battery & Sensors
  battery_plus: ^6.0.0
  geolocator: ^12.0.0
  intl: ^0.20.3

  # 🕹️ Native Android System Control
  screen_brightness: ^2.0.0      # 👈 [BARU] Kontrol Kecerahan Layar
  torch_light: ^1.0.0            # 👈 [BARU] Kontrol Senter/Flashlight
  external_app_launcher: ^3.1.0  # 👈 [BARU] Buka Aplikasi Lain (Spotify, WA, YouTube)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/jarvis.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/jarvis.png